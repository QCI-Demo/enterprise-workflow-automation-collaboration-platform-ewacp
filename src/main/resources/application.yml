server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: task-scheduler-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_scheduler}
    username: ${SPRING_DATASOURCE_USERNAME:task_scheduler}
    password: ${SPRING_DATASOURCE_PASSWORD:task_scheduler}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
