replicaCount: 1

image:
  repository: ghcr.io/ewacp/task-scheduler-service
  pullPolicy: IfNotPresent
  tag: "0.0.1-SNAPSHOT"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

config:
  serverPort: "8080"
  springDatasourceUrl: "jdbc:postgresql://postgres:5432/task_scheduler"
  springDatasourceUsername: "task_scheduler"
  springDatasourcePassword: "task_scheduler"
  springJpaHibernateDdlAuto: "validate"

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
